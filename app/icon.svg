<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 파비콘: '국' — 홈 제목과 같은 Black Han Sans 글자꼴.
       파비콘은 웹폰트를 못 불러오는 자리라 <text>로 쓰면 시스템 폰트로 대체된다.
       그래서 그 글자의 외곽선만 떠서 path로 박아 둔다(폰트 파일은 싣지 않는다).
       배경은 투명 — 밝은 탭에서도 어두운 탭에서도 글자만 남는다. -->
